name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Establish JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.1'

      - name: Verify and Repair Gradle Wrapper
        run: |
          JAR_PATH="gradle/wrapper/gradle-wrapper.jar"
          if ! unzip -tq "$JAR_PATH" > /dev/null 2>&1; then
            echo "Gradle wrapper JAR is corrupted or missing. Regenerating..."
            rm -f "$JAR_PATH"
            gradle wrapper --gradle-version 9.6.1
          else
            echo "Gradle wrapper JAR integrity verified."
          fi
          chmod +x gradlew

      - name: Compile and Build APK
        run: ./gradlew assembleDebug

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
