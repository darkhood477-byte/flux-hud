name: Android Build Execution

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Establish Java Development Kit
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Verify Gradle Wrapper Presence
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Critical Error: The 'gradlew' executable is missing from the repository root."
          exit 1
        fi

    - name: Grant Execute Permissions for Gradle
      run: chmod +x gradlew

    - name: Compile Debug APK
      run: ./gradlew assembleDebug

    - name: Archive APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
